name: Sync Fork and Compile Release

on:
  schedule:
    - cron: '0 0 * * *' # Controlla automaticamente ogni giorno a mezzanotte
  workflow_dispatch: # Ti permette di forzare il controllo e la compilazione manualmente
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.sync.outputs.new_tag }}
      should_build: ${{ steps.sync.outputs.should_build }}
    steps:
    - name: Checkout Fork
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync with Upstream Tags
      id: sync
      run: |
        # Configura la repo madre come "upstream"
        git remote add upstream https://github.com/buresdv/Cork.git
        git fetch upstream --tags

        # Prendi l'ultimo tag della repo madre e l'ultimo del tuo fork
        UPSTREAM_TAG=$(git tag -l --sort=-v:refname | head -n 1) # Questo in realtà legge i tag locali dopo il fetch
        # Per sicurezza prendiamo il tag più recente da upstream in modo esplicito
        git fetch upstream refs/tags/*:refs/tags/*
        LATEST_UPSTREAM_TAG=$(git describe --tags $(git rev-list --tags --max-count=1 upstream/main 2>/dev/null || git rev-parse upstream/main))
        
        echo "Ultima release ufficiale: $LATEST_UPSTREAM_TAG"

        # Verifica se il tuo fork ha già questo tag internamente
        if git rev-parse "$LATEST_UPSTREAM_TAG" >/dev/null 2>&1; then
          echo "Il fork è già aggiornato all'ultima release."
          echo "should_build=false" >> $GITHUB_OUTPUT
        else
          echo "Nuova release rilevata! Sincronizzazione in corso..."
          # Push del nuovo tag nel tuo fork per tenerlo sincronizzato
          git push origin "$LATEST_UPSTREAM_TAG"
          
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "new_tag=$LATEST_UPSTREAM_TAG" >> $GITHUB_OUTPUT
        fi
  build:
    needs: check-and-sync
    if: ${{ needs.check-and-sync.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26

    steps:
    - name: Determine Target Tag
      id: target
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Passiamo il token nativo di GitHub Actions
      run: |
        if [ "${{ needs.check-and-sync.outputs.new_tag }}" != "" ]; then
          echo "tag=${{ needs.check-and-sync.outputs.new_tag }}" >> $GITHUB_OUTPUT
        else
          echo "⚠️ Nessun nuovo tag rilevato da check-and-sync. Recupero l'ultimo tag ufficiale..."
          # Utilizziamo la GitHub CLI (gh) che è già autenticata e non soffre di rate-limiting
          LATEST=$(gh api repos/buresdv/Cork/releases/latest --jq '.tag_name')
          
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "❌ Errore critico: Impossibile recuperare il tag da GitHub API."
            exit 1
          fi
          
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "📌 Tag determinato per il build: $LATEST"
        fi

    - name: Checkout Specific Tag
      uses: actions/checkout@v7
      with:
        repository: 'buresdv/Cork'
        ref: ${{ steps.target.outputs.tag }} # Compila ESATTAMENTE il codice della release

    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@main
      
    - name: Trust pre-installed Homebrew Taps
      run: |
        brew trust aws/tap || true
        brew trust azure/bicep || true
        brew trust hashicorp/tap || true

    - name: Install Mise
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Tuist and Generate Project
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Fornisce il token a Mise per evitare il rate-limiting delle API
      run: |
        export MISE_TRUSTED_CONFIG_IDS=1
        mise install tuist
        
        # Estrae dinamicamente la versione di tuist richiesta dal file .mise.toml
        TUIST_VERSION=$(config_version=$(grep 'tuist =' .mise.toml 2>/dev/null | awk -F '"' '{print $2}'); echo ${config_version:-4.50.2})
        
        # Eseguiamo l'installazione delle dipendenze
        mise exec tuist@$TUIST_VERSION -- tuist install
        
        # Sostituito il flag deprecato con il nuovo parametro ufficiale richiesto da Tuist 4.x
        mise exec tuist@$TUIST_VERSION -- tuist generate --cache-profile none

    - name: Build and Archive App
      run: |
        # Usiamo -workspace al posto di -project per allinearci a quanto generato da Tuist
        # Aggiungiamo -skipPackagePluginValidation per approvare automaticamente SwiftLint
        
        xcodebuild archive \
          -workspace Cork.xcworkspace \
          -scheme "Self-Compiled" \
          -archivePath ./build/Cork.xcarchive \
          -skipPackagePluginValidation \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGN_IDENTITY="-" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          DEVELOPMENT_TEAM=""

    - name: Compress App Bundle
      run: |
        # Ci spostiamo nella directory dove xcodebuild ha depositato l'app compilata
        cd ./build/Cork.xcarchive/Products/Applications/
        
        # Creiamo un archivio zip preservando l'estensione .app e i permessi nativi
        zip -r -X ../../../../Cork-Compiled.zip Cork.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Cork-${{ steps.target.outputs.tag }}-Self-Compiled
        # Carichiamo il file zip già compresso, evitando che GitHub Actions smantelli il pacchetto .app
        path: ./Cork-Compiled.zip
